<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Educator Login | TeachCore Executive Portal</title>
  <meta name="description"
    content="Log in to your TeachCore educator account to access your enrolled programs, workshop certificates, and institutional research library.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body
  style="background: radial-gradient(circle at 50% 30%, rgba(201, 162, 74, 0.08) 0%, transparent 70%), var(--bg-black); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">

  <!-- STANDALONE AUTH CONTAINER (NO HEADER, NO FOOTER, NO MAIN NAV) -->
  <main style="width: 100%; max-width: 460px;">
    <div
      style="background: var(--bg-graphite); border: 1px solid var(--border-gold-strong); padding: 3rem 2.5rem; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(201, 162, 74, 0.15); position: relative;">

      <!-- BRAND LOGO -->
      <div style="text-align: center; margin-bottom: 2rem;">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
          <div class="logo-mark">
            <svg viewBox="0 0 24 24">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <path d="M12 6v6"></path>
              <path d="M9 9h6"></path>
            </svg>
          </div>
          <span class="brand-text">Teach<span class="core">Core</span></span>
        </a>
        <p style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em;">
          Educator Executive Portal</p>
      </div>

      <h1 style="font-size: 2rem; text-align: center; margin-bottom: 2rem;">Account Login</h1>

      <!-- LOGIN FORM -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Academic Email</label>
          <input type="email" id="email" class="form-control" required placeholder="professor@university.edu">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="password">Password</label>
            <a href="#"
              onclick="if(window.showToast) window.showToast('Password reset link sent to your academic email.', 'info'); return false;"
              style="font-size: 0.75rem; color: var(--gold);">Forgot Password?</a>
          </div>
          <div style="position: relative;">
            <input type="password" id="password" class="form-control" required
              placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility"
              style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
          <label
            style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" id="remember-me" style="accent-color: var(--gold);">
            Remember me on this browser
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1.5rem;">Login to
          TeachCore</button>

        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
          <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
          <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Or</span>
          <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
        </div>

        <button type="button" class="btn btn-secondary"
          onclick="if(window.showToast) window.showToast('Connecting Google Workspace Single Sign-On...', 'info');"
          style="width: 100%; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 2rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12.24 10.285V13.4h6.887c-.58 3.407-3.418 5.618-6.887 5.618-4.162 0-7.538-3.376-7.538-7.538s3.376-7.538 7.538-7.538c1.884 0 3.593.684 4.922 1.815l2.42-2.42C17.72 1.69 15.17.8 12.24.8 6.04.8 1 5.84 1 12s5.04 11.2 11.24 11.2c6.48 0 10.77-4.56 10.77-10.97 0-.75-.08-1.46-.22-2.145H12.24z" />
          </svg>
          Continue with Google Workspace
        </button>

        <p style="text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
          Don't have an educator account? <a href="signup.html"
            style="color: var(--gold-bright); font-weight: 600;">Create an account</a>
        </p>

        <div
          style="text-align: center; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle);">
          <a href="index.html"
            style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em;">&larr;
            Return to TeachCore Homepage</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
